<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Commanding Liberty Logo">
  <!-- Outer White Circle with Navy Border -->
  <circle cx="200" cy="200" r="192" fill="#FFFFFF" stroke="#060C3B" stroke-width="8" />
  <!-- Thin Inner Yellow Ring -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="#FFDD00" stroke-width="3" />

  <defs>
    <!-- Text Paths for Circular Arcs -->
    <path id="topArc" d="M 50,200 A 150,150 0 1,1 350,200" />
    <path id="bottomInnerArc" d="M 345,200 A 145,145 0 0,1 55,200" />
    <path id="bottomOuterArc" d="M 372,200 A 172,172 0 0,1 28,200" />
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#060C3B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Top Arc Text: EMPOWERING MINDS -->
  <text fill="#060C3B" font-size="23" font-weight="900" font-family="Arial, 'Montserrat', sans-serif" letter-spacing="4.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      EMPOWERING MINDS
    </textPath>
  </text>

  <!-- Left Rosette Emblem -->
  <g transform="translate(62, 200)">
    <circle cx="0" cy="0" r="11" stroke="#060C3B" stroke-width="2" fill="#FFFFFF" />
    <path d="M 0,-11 L 0,11 M -11,0 L 11,0 M -7,-7 L 7,7 M -7,7 L 7,-7" stroke="#060C3B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#060C3B" />
  </g>

  <!-- Right Rosette Emblem -->
  <g transform="translate(338, 200)">
    <circle cx="0" cy="0" r="11" stroke="#060C3B" stroke-width="2" fill="#FFFFFF" />
    <path d="M 0,-11 L 0,11 M -11,0 L 11,0 M -7,-7 L 7,7 M -7,7 L 7,-7" stroke="#060C3B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#060C3B" />
  </g>

  <!-- Bottom Inner Arc Text: LIBERATING SOULS -->
  <text fill="#060C3B" font-size="18" font-weight="900" font-family="Arial, 'Montserrat', sans-serif" letter-spacing="3.5">
    <textPath href="#bottomInnerArc" startOffset="50%" text-anchor="middle">
      LIBERATING SOULS
    </textPath>
  </text>

  <!-- Bottom Outer Arc Text: COMMANDING LIBERTY -->
  <text fill="#060C3B" font-size="23" font-weight="900" font-family="Arial, 'Montserrat', sans-serif" letter-spacing="4">
    <textPath href="#bottomOuterArc" startOffset="50%" text-anchor="middle">
      COMMANDING LIBERTY
    </textPath>
  </text>

  <!-- Inner Deep Navy Circle with Yellow Accent Stroke -->
  <circle cx="200" cy="200" r="120" fill="#060C3B" stroke="#FFDD00" stroke-width="4" />

  <!-- Center Open Book Emblem -->
  <g transform="translate(200, 200)" filter="url(#bookShadow)">
    <!-- Left Book Layered Pages -->
    <path d="M -3,38 C -25,25 -52,22 -72,25 L -72,-35 C -50,-38 -25,-32 -3,-18 Z" fill="#FFDD00" stroke="#060C3B" stroke-width="3" />
    <path d="M -8,32 C -28,21 -52,18 -67,21 L -67,-28 C -50,-31 -28,-26 -8,-14 Z" fill="#FFE500" stroke="#060C3B" stroke-width="2" />
    <path d="M -13,26 C -31,17 -52,14 -62,17 L -62,-21 C -50,-24 -31,-20 -13,-10 Z" fill="#FFF275" stroke="#060C3B" stroke-width="1.5" />

    <!-- Right Book Layered Pages -->
    <path d="M 3,38 C 25,25 52,22 72,25 L 72,-35 C 50,-38 25,-32 3,-18 Z" fill="#FFDD00" stroke="#060C3B" stroke-width="3" />
    <path d="M 8,32 C 28,21 52,18 67,21 L 67,-28 C 50,-31 28,-26 8,-14 Z" fill="#FFE500" stroke="#060C3B" stroke-width="2" />
    <path d="M 13,26 C 31,17 52,14 62,17 L 62,-21 C 50,-24 31,-20 13,-10 Z" fill="#FFF275" stroke="#060C3B" stroke-width="1.5" />

    <!-- Center Spine Line -->
    <line x1="0" y1="-30" x2="0" y2="40" stroke="#060C3B" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
